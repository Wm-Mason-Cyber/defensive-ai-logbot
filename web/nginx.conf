# nginx.conf — "Acme Corp" web server for the Defensive AI lab
#
# Two jobs:
#   1. Serve a public site plus a password-protected admin console (the target).
#   2. Write one JSON object per request to /var/log/lab/access.json, which is
#      bind-mounted to ./logs/ on your machine so the SOC broker can tail it.
#
# The "firewall" is the include at the bottom of the server block: the SOC
# broker writes `deny <ip>;` rules into ./firewall/blocklist.conf and
# firewall-watch.sh reloads nginx whenever that file changes.

worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Structured (JSON) access log — one event per line. Machines read JSON far
    # more reliably than the classic "combined" text format.
    log_format json_soc escape=json
        '{"ts":"$time_iso8601",'
        '"src_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"user":"$remote_user",'
        '"ua":"$http_user_agent",'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time}';

    access_log /var/log/lab/access.json json_soc;
    error_log  /var/log/lab/error.log warn;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # ── Enforcement point ───────────────────────────────────────────────
        # Rules written by the SOC broker. Denied clients get 403 everywhere.
        include /etc/nginx/blocklist/*.conf;
        error_page 403 /blocked.html;
        location = /blocked.html { internal; allow all; }

        # ── Protected resource (the target) ─────────────────────────────────
        location /admin/ {
            auth_basic           "Acme Corp Admin Console";
            auth_basic_user_file /etc/nginx/htpasswd;
            try_files /admin/index.html =404;
        }

        # ── Health check used by docker compose ─────────────────────────────
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ── Public site ─────────────────────────────────────────────────────
        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
